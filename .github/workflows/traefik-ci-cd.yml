name: Traefik CI/CD runner

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ricofilm # Utilise l'environnement GitHub "ricofilm" (mêmes secrets/vars que ricofilm-web)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ricohoho --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/ricohoho/ricofilm-traefik:latest -f Dockerfile .

      - name: Push Docker image
        run: docker push ghcr.io/ricohoho/ricofilm-traefik:latest

      - name: Deploy to OVH Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_IP }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "Connexion au registre GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ricohoho --password-stdin

            echo "Téléchargement de la dernière image Traefik..."
            docker pull ghcr.io/ricohoho/ricofilm-traefik:latest

            echo "Arrêt de l'ancien conteneur Traefik..."
            docker stop traefik || true
            docker rm traefik || true

            echo "Vérification du réseau ricofilm-network..."
            docker network inspect ricofilm-network >/dev/null 2>&1 || docker network create ricofilm-network

            echo "Vérification du volume persistant pour les certificats SSL..."
            docker volume inspect traefik-certificates >/dev/null 2>&1 || docker volume create traefik-certificates

            echo "Démarrage du conteneur Traefik..."
            docker run -d \
              --name traefik \
              --restart unless-stopped \
              --network ricofilm-network \
              -p 80:80 \
              -p 443:443 \
              --add-host=host.docker.internal:host-gateway \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v traefik-certificates:/letsencrypt \
              -e TZ=Europe/Paris \
              ghcr.io/ricohoho/ricofilm-traefik:latest

            echo "Déploiement terminé avec succès !"
            docker ps --filter name=traefik
