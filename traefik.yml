api:
  dashboard: true
  insecure: false

entryPoints:
  # Port 80 (HTTP) : Redirection automatique vers HTTPS (Port 443)
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # Port 443 (HTTPS)
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Gestionnaire automatique des certificats SSL/TLS Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: "ricohoho@gmail.com"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web

providers:
  # Provider Fichier : pour recharger à chaud toutes les redirections déclarées dans ./dynamic/
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

  # Provider Docker : pour détecter automatiquement les conteneurs utilisant des labels Docker
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "ricofilm-network"
    watch: true

log:
  level: INFO

accessLog: {}
